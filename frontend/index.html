    <meta name="color-scheme" content="light" />

    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="Leviaan Campus" />
    <meta property="og:url" content="https://leviaan.vercel.app/" />
    <meta property="og:title" content="Leviaan Campus — Activiteitenbord" />
    <meta
      property="og:description"
      content="Zie wat er in huis speelt. Inloggen met Google. Anderen zien alleen de naam die jij kiest."
    />
    <meta property="og:image" content="https://leviaan.vercel.app/logo-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Leviaan activiteiten" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leviaan Campus — Activiteitenbord" />

      name="twitter:description"
      content="Zie wat er in huis speelt. Inloggen met Google. Anderen zien alleen de naam die jij kiest."
    />
    <meta name="twitter:image" content="https://leviaan.vercel.app/logo-share.jpg" />

    <script>
      // Zet de donkere modus voordat React laadt, anders flitst het scherm eerst wit.
      // Zelfde sleutel en zelfde keuze als src/contexts/ThemeContext.jsx.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("leviaan_theme");
        } catch (error) {
          stored = null;
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!dark) return;
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", "#0b1f3a");
        var colorScheme = document.querySelector('meta[name="color-scheme"]');
        if (colorScheme) colorScheme.setAttribute("content", "dark");
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap"
      rel="stylesheet"
    />
  </head>
