name: Keep Render backend awake

# Render free web services slapen na ~15 min zonder verkeer.
# Een GitHub Action pingt /health elke 10 minuten. Render-cron is niet gratis.
#
# Eenmalig, na de eerste Render-deploy:
# GitHub → Settings → Secrets and variables → Actions → Variables
# → New repository variable
# Name: RENDER_BACKEND_URL
# Value: https://jouw-service.onrender.com  (zonder slash aan het eind)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::RENDER_BACKEND_URL repository variable ontbreekt."
            echo "::error::Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          body=$(mktemp)
          hdr=$(mktemp)
          deadline=$((SECONDS + 120))
          code=""
          seconds=""
          routing=""
          rc=0

          while true; do
            rc=0
            result=$(curl -sS -D "$hdr" -o "$body" -w '%{http_code} %{time_total}' \
              --connect-timeout 15 \
              --max-time 90 \
              "$BACKEND_URL/health") || rc=$?
            read -r code seconds <<< "$result"
            routing=$(grep -i '^x-render-routing:' "$hdr" | tr -d '\r' | awk '{print $2}')

            if [ "$rc" -eq 0 ] && [ "$code" = "200" ]; then
              echo "Backend is awake - HTTP 200 in ${seconds}s."
              cat "$body"; echo
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi

            echo "Waiting for wake (HTTP ${code:-err} curl=$rc routing=${routing:-none})..."
            sleep 10
          done

          echo "::error::$BACKEND_URL/health gaf HTTP ${code:-err} (curl=$rc)."
          cat "$hdr"; echo
          cat "$body"; echo
          exit 1
