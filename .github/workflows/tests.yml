name: Tests

# De beveiligingstests draaien bij elke push en elke pull request.
# Google wordt nagebootst, dus er is geen netwerk naar Google nodig.
# De database is een wegwerp-Postgres in deze runner, nooit die van het huis.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leviaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Run the suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leviaan_test
        run: npm test

  frontend:
    name: Frontend contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Run the checks
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  packages:
    name: Package scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Known problems in backend packages
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Known problems in frontend packages
        working-directory: frontend
        run: npm audit --audit-level=high
